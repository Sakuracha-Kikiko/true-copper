modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Sakuracha-Kikiko/True-Copper/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "樱茶琪琪子"
description = '''Adds features and compatibilities for The Zenith Sword.

Currently:
- The instantaneous damage of a swing is held back until a flying Zenith blade actually reaches the target, so damage and visuals line up.
- Swing and hit sounds that carry across the sword's full reach.
- A Zenith Sword work mode for Touhou Little Maid.
- Two cosmetic variants: the True Copper Shortsword and the True Wooden Sword.'''

[[mixins]]
config = "true_copper.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "the_zenith_sword"
type = "required"
versionRange = "[2.0.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "touhou_little_maid"
type = "optional"
versionRange = "[1.5.3,)"
ordering = "AFTER"
side = "BOTH"
